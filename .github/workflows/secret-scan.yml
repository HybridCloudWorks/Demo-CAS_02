name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # gitleaks CLI (gitleaks-action needs a paid license for org-owned repos).
      # To upgrade: take the new version and the linux_x64 line from that release's gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$sums" "$base/$sums"
          # The pinned hash must match the release's checksums file, and the download must match the pinned hash.
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" "$sums" || { echo "::error::pinned SHA-256 not found in $sums"; exit 1; }
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks (full history, findings redacted)
        run: |
          gitleaks version
          gitleaks git --redact --verbose --no-banner --exit-code 1 .
  placeholders-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on GUIDs in tracked files (sanitization gate)
        run: |
          set -e
          if grep -rEn --exclude-dir=.git --exclude='*.pptx' --exclude='*.png' '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' . | grep -vE 'policyDefinitions/|incident-schema|REDACTED' ; then
            echo "GUID found in tracked content"; exit 1; fi
          echo "sanitization gate passed"
