name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2   # version: verification required against current official documentation
  placeholders-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on GUIDs or public IPs in tracked files (sanitization gate)
        run: |
          set -e
          if grep -rEn --exclude-dir=.git --exclude='*.pptx' --exclude='*.png' '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' . | grep -vE 'policyDefinitions/|incident-schema|REDACTED' ; then
            echo "GUID found in tracked content"; exit 1; fi
          echo "sanitization gate passed"
