#cloud-config
# Shared Linux guest configuration for arc-hyperv-demo, arc-aws-demo, arc-gcp-demo.
# No secrets. The Arc agent is NOT installed here; onboarding is an explicit, visible step (onboard-arc.sh).
package_update: true
package_upgrade: false
packages:
  - curl
  - jq
  - python3
  - ca-certificates

write_files:
  - path: /opt/arc-demo/health_server.py
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env python3
      """Harmless demo service: local-only HTTP health endpoint. No customer data, no dependencies."""
      import json, socket, time
      from http.server import BaseHTTPRequestHandler, HTTPServer

      START = time.time()

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              body = json.dumps({
                  "service": "arc-demo-health",
                  "status": "healthy",
                  "host": socket.gethostname(),
                  "uptime_seconds": int(time.time() - START),
              }).encode()
              self.send_response(200 if self.path == "/health" else 404)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              if self.path == "/health":
                  self.wfile.write(body)
          def log_message(self, *args):  # keep journal quiet
              return

      if __name__ == "__main__":
          HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()

  - path: /etc/systemd/system/arc-demo-health.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Arc demo health endpoint (safe to stop; lab only)
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/arc-demo/health_server.py
      Restart=no
      User=nobody
      Group=nogroup
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/arc-demo-heartbeat.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Arc demo heartbeat: writes health state to syslog for Log Analytics

      [Service]
      Type=oneshot
      ExecStart=/opt/arc-demo/heartbeat.sh

  - path: /etc/systemd/system/arc-demo-heartbeat.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Run arc-demo-heartbeat every minute

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

  - path: /opt/arc-demo/heartbeat.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Deterministic health signal: one syslog line per minute, tag arc-demo-health.
      set -euo pipefail
      status="unhealthy"
      if systemctl is-active --quiet arc-demo-health && curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null; then
        status="healthy"
      fi
      logger -t arc-demo-health -p user.notice "service=arc-demo-health status=${status} host=$(hostname)"

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now arc-demo-health.service
  - systemctl enable --now arc-demo-heartbeat.timer
  - [ sh, -c, "sleep 2 && curl -fsS http://127.0.0.1:8080/health || true" ]
